<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neutron Energy Kenya - Job Card</title>
<style>
:root{--green:#0b6e36;--light:#e8f5e9}
body{font-family:system-ui,Arial,sans-serif;margin:0;background:#f5f5f5}
.header{background:var(--green);color:#fff;padding:12px;text-align:center;font-weight:700}
.card{background:#fff;margin:12px;padding:14px;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.1)}
label{font-size:13px;font-weight:600;display:block;margin-top:10px}
input,select,textarea{width:100%;padding:10px;margin-top:4px;border:1px solid #ccc;border-radius:6px;font-size:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{background:var(--green);color:#fff;border:none;padding:12px;border-radius:8px;width:100%;margin-top:12px;font-weight:700;font-size:15px}
.btn:disabled{opacity:.5}
.small{font-size:11px;color:#666;margin-top:4px}
.enc-badge{font-size:10px;background:#111;color:#0f0;padding:2px 6px;border-radius:4px;margin-left:8px}
</style>
</head>
<body>
<div class="header">NEUTRON ENERGY KENYA - JOB CARD <span class="enc-badge">AES-GCM ENCRYPTED</span></div>

<div class="card">
<label>Job No</label>
<input id="jobNo" readonly>
<label>Date</label>
<input type="date" id="date">
<div class="row">
<div><label>Time In</label><input type="time" id="timeIn"></div>
<div><label>Time Out</label><input type="time" id="timeOut"><div class="small" id="timeErr" style="color:red"></div></div>
</div>
<label>Client Name</label>
<input id="client">
<label>Generator Details</label>
<input id="generator">
<label>Service Notes</label>
<textarea id="notes" rows="3"></textarea>
<label>Technician Photo</label>
<input type="file" id="photo" accept="image/*">
<div class="small">Images auto-compressed to 800px / 0.6 quality before encrypted save</div>
<button class="btn" id="saveBtn" onclick="saveJob()">SAVE JOB (Encrypted)</button>
<div class="small" id="saveMsg"></div>
</div>

<div class="card">
<label>Search History</label>
<input id="search" placeholder="Search client / job no" oninput="debouncedSearch()">
<div id="history"></div>
</div>

<script>
// === IMPROVEMENTS WITHOUT LAYOUT CHANGE ===
const ENC_KEY_STORAGE = 'nek_enc_key_v1';
const JOBS_KEY = 'nj_enc';
const COUNTER_KEY = 'ngc_lock_v1';
const SESSION_KEY = 'nek_session';

async function getKey(){
 let raw = localStorage.getItem(ENC_KEY_STORAGE);
 if(!raw){
   const salt = crypto.getRandomValues(new Uint8Array(16));
   const pass = 'NEK-2026-SECURE-CHANGE-ME';
   const enc = new TextEncoder();
   const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
   const key = await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:100000,hash:'SHA-256'}, keyMaterial, {name:'AES-GCM',length:256}, true, ['encrypt','decrypt']);
   const exported = await crypto.subtle.exportKey('raw', key);
   localStorage.setItem(ENC_KEY_STORAGE, btoa(String.fromCharCode(...new Uint8Array(salt))) + ':' + btoa(String.fromCharCode(...new Uint8Array(exported))));
   return key;
 } else {
   const [saltB64, keyB64] = raw.split(':');
   const salt = Uint8Array.from(atob(saltB64), c=>c.charCodeAt(0));
   const keyRaw = Uint8Array.from(atob(keyB64), c=>c.charCodeAt(0));
   return await crypto.subtle.importKey('raw', keyRaw, 'AES-GCM', true, ['encrypt','decrypt']);
 }
}
async function encryptJSON(obj){
 const key = await getKey();
 const iv = crypto.getRandomValues(new Uint8Array(12));
 const enc = new TextEncoder();
 const data = await crypto.subtle.encrypt({name:'AES-GCM',iv}, key, enc.encode(JSON.stringify(obj)));
 const combined = new Uint8Array(iv.byteLength + data.byteLength);
 combined.set(iv,0); combined.set(new Uint8Array(data), iv.byteLength);
 return btoa(String.fromCharCode(...combined));
}
async function decryptJSON(b64){
 try{
  const key = await getKey();
  const combined = Uint8Array.from(atob(b64), c=>c.charCodeAt(0));
  const iv = combined.slice(0,12);
  const data = combined.slice(12);
  const dec = await crypto.subtle.decrypt({name:'AES-GCM',iv}, key, data);
  return JSON.parse(new TextDecoder().decode(dec));
 }catch(e){ return [] }
}
function getNextJobNo(){
 let c = parseInt(localStorage.getItem(COUNTER_KEY) || '0');
 c++; localStorage.setItem(COUNTER_KEY, c.toString());
 return 'NEK-' + String(c).padStart(4,'0');
}
(async()=>{
 let c = parseInt(localStorage.getItem(COUNTER_KEY) || '0');
 if(c===0){ document.getElementById('jobNo').value = 'NEK-0001'; }
 else { document.getElementById('jobNo').value = 'NEK-' + String(c+1).padStart(4,'0'); }
 renderHistory();
})();
function compressImage(file){
 return new Promise((res,rej)=>{
  const img = new Image();
  img.onload = ()=>{
    const canvas = document.createElement('canvas');
    const max = 800;
    let w = img.width, h = img.height;
    if(w>max || h>max){ if(w>h){ h = h*max/w; w=max } else { w = w*max/h; h=max } }
    canvas.width=w; canvas.height=h;
    canvas.getContext('2d').drawImage(img,0,0,w,h);
    res(canvas.toDataURL('image/jpeg',0.6));
  };
  img.onerror=rej;
  img.src = URL.createObjectURL(file);
 });
}
function validateTime(){
 const tin = document.getElementById('timeIn').value;
 const tout = document.getElementById('timeOut').value;
 const err = document.getElementById('timeErr');
 if(tin && tout && tout <= tin){ err.textContent='Time Out must be after Time In'; return false }
 err.textContent=''; return true;
}
document.getElementById('timeOut').addEventListener('change', validateTime);
document.getElementById('timeIn').addEventListener('change', validateTime);
let photoData = '';
document.getElementById('photo').addEventListener('change', async (e)=>{
 if(e.target.files[0]) photoData = await compressImage(e.target.files[0]);
});
async function saveJob(){
 if(!validateTime()) return;
 const btn = document.getElementById('saveBtn');
 if(btn.disabled) return;
 btn.disabled = true;
 btn.textContent = 'Saving Encrypted...';
 const job = {
   jobNo: document.getElementById('jobNo').value,
   date: document.getElementById('date').value,
   timeIn: document.getElementById('timeIn').value,
   timeOut: document.getElementById('timeOut').value,
   client: document.getElementById('client').value,
   generator: document.getElementById('generator').value,
   notes: document.getElementById('notes').value,
   photo: photoData,
   created: new Date().toISOString()
 };
 let jobs = [];
 const enc = localStorage.getItem(JOBS_KEY);
 if(enc) jobs = await decryptJSON(enc);
 jobs.push(job);
 const encNew = await encryptJSON(jobs);
 localStorage.setItem(JOBS_KEY, encNew);
 let c = parseInt(localStorage.getItem(COUNTER_KEY)||'0'); c++;
 localStorage.setItem(COUNTER_KEY, c.toString());
 document.getElementById('saveMsg').textContent = 'Saved encrypted. LocalStorage now shows gibberish, not plain JSON.';
 setTimeout(()=>{ location.reload(); }, 800);
}
let debounceTimer;
function debouncedSearch(){ clearTimeout(debounceTimer); debounceTimer = setTimeout(()=>renderHistory(),300); }
async function renderHistory(){
 const q = (document.getElementById('search').value||'').toLowerCase();
 const enc = localStorage.getItem(JOBS_KEY);
 let jobs = enc ? await decryptJSON(enc) : [];
 if(q) jobs = jobs.filter(j=> (j.client+j.jobNo).toLowerCase().includes(q));
 const div = document.getElementById('history');
 div.innerHTML = jobs.slice(-20).reverse().map(j=>`<div style="border-bottom:1px solid #eee;padding:6px 0;font-size:13px"><b>${j.jobNo}</b> - ${j.client} - ${j.date||''}</div>`).join('');
}
(function checkSession(){
 const s = localStorage.getItem(SESSION_KEY);
 if(!s) localStorage.setItem(SESSION_KEY, Date.now().toString());
 else if(Date.now() - parseInt(s) > 86400000){ alert('Session expired - please login again'); localStorage.setItem(SESSION_KEY, Date.now().toString()); }
})();
</script>
</body>
</html>
