<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NEUTRON V6 FULL - PHOTOS + SIGNATURE + LOGIN</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#000;color:#fff}
.login{position:fixed;inset:0;background:#000;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}.login-box{background:#111;border:2px solid #00c853;border-radius:16px;padding:24px;width:100%;max-width:380px;text-align:center}.login-box input{width:100%;padding:12px;margin:8px 0;background:#1a1a1a;border:1px solid #333;color:#fff;border-radius:8px}
.h{text-align:center;padding:12px;border-bottom:2px solid #00c853;position:sticky;top:0;background:#000;z-index:10}.h span{color:#00e676}
.nav{display:flex;gap:6px;padding:8px;background:#111;overflow:auto}.nav button{background:#222;color:#aaa;border:1px solid #333;padding:8px 12px;border-radius:20px;font-weight:700;font-size:10px;white-space:nowrap}.nav button.on{background:#00c853;color:#fff}
.card{background:#111;margin:8px;border-radius:12px;border:1px solid #222;overflow:hidden}.fh{background:#0a0a0a;padding:10px;display:flex;justify-content:space-between;font-size:12px}
.form{padding:12px;background:#f5f5f5;color:#000}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.full{grid-column:1/-1}
label{font-size:10px;font-weight:800;color:#555;display:block;margin-bottom:3px}input,select,textarea{width:100%;padding:10px;background:#1a1a1a;color:#fff;border:1px solid #333;border-radius:6px;font-size:12px}textarea{min-height:70px}
.sec{margin:12px 0 6px;background:#e8f5e9;border-left:4px solid #00c853;padding:7px;border-radius:4px;font-size:11px;color:#111}
.check{display:grid;grid-template-columns:1fr 1fr;gap:6px}.chk{background:#1e1e1e;border:1px solid #333;border-radius:6px;padding:6px;display:flex;justify-content:space-between;font-size:11px;color:#fff}
.btn{padding:11px;border-radius:7px;font-weight:800;border:none;width:100%;cursor:pointer;font-size:11px}.bg{background:#00c853;color:#fff}.bd{background:#333;color:#fff}.bo{background:#111;color:#00e676;border:1px solid #00c853}
.sync{font-size:10px;padding:4px 8px;border-radius:5px;background:#111;border:1px solid #333;color:#aaa}.ok{border-color:#00c853;color:#00e676}
.jr{background:#1a1a1a;border:1px solid #333;border-radius:8px;padding:8px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#fff}
.photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}.photo-box{background:#1a1a1a;border:1px dashed #555;border-radius:8px;height:90px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.photo-box img{width:100%;height:100%;object-fit:cover}
.sig-wrap{background:#fff;border-radius:8px;padding:6px;margin-top:6px}.sig-wrap canvas{width:100%;height:120px;background:#fff;border-radius:4px;touch-action:none}
</style>
</head>
<body>
<div id="loginOverlay" class="login"><div class="login-box"><h2 style="color:#00e676">NEUTRON LOGIN</h2><input id="loginEmail" value="admin@neutron.co.ke"><input id="loginPass" type="password" value="Neutron2025"><button id="loginBtn" class="btn bg" style="margin-top:8px;padding:14px">LOGIN</button><p id="loginMsg" style="font-size:11px;margin-top:8px;min-height:16px;color:#ff5252"></p></div></div>

<div class="h"><h1>NEUTRON<br><span>ENERGY KENYA</span></h1><p style="color:#00e676;font-size:9px">V6 FULL - PHOTOS + SIGNATURE + LOGIN + HISTORY</p><div style="margin-top:6px"><span id="sync" class="sync">Local</span> <span id="jid" class="sync ok">GEN-...</span> <button id="logoutBtn" style="background:#333;color:#fff;border:none;padding:4px 8px;border-radius:5px;font-size:9px;margin-left:6px">Logout</button></div></div>

<div class="nav"><button class="on" id="b1">New</button><button id="b2">History (<span id="hc">0</span>)</button><button id="b3">Photos</button><button id="b4">Sign</button><button id="b5">Backup</button></div>

<div id="t-new" class="card"><div class="fh"><b>Job Card</b></div><div class="form">
<div class="row"><div><label>Job No</label><input id="jobNo" readonly><input type="hidden" id="internalId"></div><div><label>Date</label><input type="date" id="jobDate"></div></div>
<div class="sec"><b>A. Client</b></div>
<div class="row"><div><label>Client Name *</label><input id="clientName"></div><div><label>Phone *</label><input id="clientPhone"><small id="ph" style="font-size:10px"></small></div></div>
<div class="row"><div class="full"><label>Location *</label><input id="location"></div></div>
<div class="sec"><b>B. Generator</b></div><div class="row"><div><label>Model *</label><input id="genType"></div><div><label>Serial *</label><input id="serialNo"></div></div>
<div class="sec"><b>C. Work Done</b></div><div class="row"><div class="full"><textarea id="serviceDesc" placeholder="Work done, faults, parts..."></textarea></div></div>
<div class="sec"><b>D. Checklist</b></div><div class="check" id="cl"></div>
<div class="sec"><b>E. Extra / Costs</b></div><div class="row"><div class="full"><textarea id="extraNotes"></textarea></div></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px"><button id="saveBtn" class="btn bg">SAVE</button><button id="waClientBtn" class="btn bo">Client WA</button></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px"><button id="waOfficeBtn" class="btn bo">Office WA</button><button id="clearBtn" class="btn bd">Clear</button></div>
<div id="ss" style="font-size:10px;color:#00c853;margin-top:8px;min-height:14px"></div>
</div></div>

<div id="t-photos" class="card" style="display:none"><div class="fh"><b>Photos - Attached to Job</b></div><div class="form"><label>Take / Upload Photos (max 6)</label><input type="file" id="photoInput" accept="image/*" capture="environment" multiple style="background:#fff;color:#000"><div id="photoGrid" class="photo-grid"></div><button id="clearPhotosBtn" class="btn bd" style="margin-top:8px">Clear Photos</button><p style="font-size:10px;color:#666;margin-top:6px">Photos saved with job, will be exported</p></div></div>

<div id="t-sign" class="card" style="display:none"><div class="fh"><b>Signatures</b></div><div class="form">
<label>Technician Signature</label><div class="sig-wrap"><canvas id="sigTech"></canvas></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px"><button id="clearTechBtn" class="btn bd">Clear Tech</button><button id="saveTechBtn" class="btn bo">Save Tech Sig</button></div>
<label style="margin-top:12px">Client Signature</label><div class="sig-wrap"><canvas id="sigClient"></canvas></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px"><button id="clearClientBtn" class="btn bd">Clear Client</button><button id="saveClientBtn" class="btn bo">Save Client Sig</button></div>
<div id="sigStatus" style="font-size:10px;color:#00c853;margin-top:8px"></div>
</div></div>

<div id="t-hist" class="card" style="display:none"><div class="fh"><b>History</b></div><div class="form" style="background:#111;color:#fff"><input id="sq" placeholder="Search..." style="background:#222;color:#fff"><div id="jl" style="margin-top:10px"></div></div></div>
<div id="t-back" class="card" style="display:none"><div class="fh"><b>Backup</b></div><div class="form"><div id="at" style="background:#1a1a1a;color:#aaa;padding:8px;border-radius:6px;max-height:150px;overflow:auto;font-size:10px;white-space:pre-wrap"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px"><button id="expBtn" class="btn bo">Export JSON</button><label class="btn bd" style="text-align:center">Import<input type="file" id="imp" accept=".json" style="display:none"></label></div></div></div>

<script>
var items=["Oil Level","Coolant","Fuel System","Battery","Belts","Air Filter","Oil Filter","Fuel Filter","Exhaust","Mounting","ATS Panel","Alarms","Cooling System","Safety","Wiring","Control Panel"];
var photos=[],sigTechData="",sigClientData="";
function getKenyaDate(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function validateKenyanPhone(p){var c=(p||'').replace(/\D/g,'');var n=c;if(c.indexOf('254')===0)n=c.slice(3);else if(c.indexOf('0')===0)n=c.slice(1);var v=/^[71]\d{8}$/.test(n);return{valid:v,full254:v?'254'+n:null,local0:v?'0'+n:null,cleaned:c};}
function genJobNo(){var c=parseInt(localStorage.getItem('ngc')||'0');return 'GEN-'+new Date().getFullYear()+'-'+String(c+1).padStart(5,'0');}
function commitJobNo(){var c=parseInt(localStorage.getItem('ngc')||'0')+1;localStorage.setItem('ngc',String(c));return 'GEN-'+new Date().getFullYear()+'-'+String(c).padStart(5,'0');}
function genInternalId(){return 'id_'+Date.now()+'_'+Math.random().toString(36).substr(2,6);}
function showLogin(s){document.getElementById('loginOverlay').style.display=s?'flex':'none';}
function initApp(){var nid=genInternalId();var nj=genJobNo();document.getElementById('jobNo').value=nj+' (pending)';document.getElementById('internalId').value=nid;document.getElementById('jobDate').value=getKenyaDate();document.getElementById('jid').textContent=nj;document.getElementById('cl').innerHTML=items.map(function(it,i){return '<div class="chk"><span>'+it+'</span><select id="ch'+i+'"><option>PASS</option><option>FAIL</option><option>N/A</option></select></div>';}).join('');setupSig('sigTech');setupSig('sigClient');rh();renderPhotos();}
function setupSig(id){var canvas=document.getElementById(id);var ctx=canvas.getContext('2d');function resize(){canvas.width=canvas.offsetWidth*2;canvas.height=120*2;ctx.scale(2,2);ctx.lineWidth=2;ctx.lineCap='round';ctx.strokeStyle='#000';}resize();var drawing=false;function pos(e){var rect=canvas.getBoundingClientRect();var t=e.touches?e.touches[0]:e;return{x:t.clientX-rect.left,y:t.clientY-rect.top};}
canvas.addEventListener('mousedown',function(e){drawing=true;var p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);});canvas.addEventListener('mousemove',function(e){if(!drawing)return;var p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();});canvas.addEventListener('mouseup',function(){drawing=false;});canvas.addEventListener('touchstart',function(e){drawing=true;var p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);e.preventDefault();});canvas.addEventListener('touchmove',function(e){if(!drawing)return;var p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();e.preventDefault();});canvas.addEventListener('touchend',function(){drawing=false;});}

document.addEventListener('DOMContentLoaded',function(){
  var logged=localStorage.getItem('neutron_auth')==='logged';showLogin(!logged);if(logged)initApp();
  document.getElementById('loginBtn').addEventListener('click',function(){var e=document.getElementById('loginEmail').value.trim();var p=document.getElementById('loginPass').value.trim();var m=document.getElementById('loginMsg');m.textContent='Checking...';var valid=(e==='admin@neutron.co.ke'&&p==='Neutron2025')||(e==='0795467171'&&p==='0795467171')||(e==='admin'&&p==='admin');setTimeout(function(){if(valid){localStorage.setItem('neutron_auth','logged');m.textContent='SUCCESS';showLogin(false);initApp();}else{m.textContent='Invalid - admin@neutron.co.ke / Neutron2025';}},300);});
  document.getElementById('logoutBtn').addEventListener('click',function(){if(confirm('Logout?')){localStorage.removeItem('neutron_auth');showLogin(true);}});
  document.getElementById('b1').addEventListener('click',function(){tab('new');});document.getElementById('b2').addEventListener('click',function(){tab('hist');});document.getElementById('b3').addEventListener('click',function(){tab('photos');});document.getElementById('b4').addEventListener('click',function(){tab('sign');});document.getElementById('b5').addEventListener('click',function(){tab('back');});
  document.getElementById('saveBtn').addEventListener('click',saveJ);document.getElementById('waClientBtn').addEventListener('click',sendClient);document.getElementById('waOfficeBtn').addEventListener('click',sendOffice);document.getElementById('clearBtn').addEventListener('click',clearForm);
  document.getElementById('photoInput').addEventListener('change',handlePhotos);document.getElementById('clearPhotosBtn').addEventListener('click',function(){photos=[];renderPhotos();document.getElementById('ss').textContent='Photos cleared';});
  document.getElementById('clearTechBtn').addEventListener('click',function(){var c=document.getElementById('sigTech');c.getContext('2d').clearRect(0,0,c.width,c.height);sigTechData='';});document.getElementById('saveTechBtn').addEventListener('click',function(){sigTechData=document.getElementById('sigTech').toDataURL();document.getElementById('sigStatus').textContent='Tech signature saved';});
  document.getElementById('clearClientBtn').addEventListener('click',function(){var c=document.getElementById('sigClient');c.getContext('2d').clearRect(0,0,c.width,c.height);sigClientData='';});document.getElementById('saveClientBtn').addEventListener('click',function(){sigClientData=document.getElementById('sigClient').toDataURL();document.getElementById('sigStatus').textContent='Client signature saved';});
  document.getElementById('sq').addEventListener('input',rh);document.getElementById('expBtn').addEventListener('click',exp);document.getElementById('imp').addEventListener('change',im);
  var cp=document.getElementById('clientPhone');if(cp)cp.addEventListener('input',function(ev){var r=validateKenyanPhone(ev.target.value);document.getElementById('ph').textContent=r.valid?'Valid '+r.local0:'Invalid';document.getElementById('ph').style.color=r.valid?'#00c853':'#c00';});
});
function handlePhotos(e){var files=e.target.files;if(!files)return;Array.from(files).forEach(function(f){if(photos.length>=6)return;var r=new FileReader();r.onload=function(ev){photos.push(ev.target.result);renderPhotos();};r.readAsDataURL(f);});}
function renderPhotos(){var g=document.getElementById('photoGrid');if(!g)return;g.innerHTML='';photos.forEach(function(p,i){var div=document.createElement('div');div.className='photo-box';var img=document.createElement('img');img.src=p;var del=document.createElement('button');del.textContent='X';del.style.cssText='position:absolute;top:2px;right:2px;background:#c00;color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:10px';del.onclick=function(){photos.splice(i,1);renderPhotos();};div.appendChild(img);div.appendChild(del);g.appendChild(div);});}
function tab(t){var map={'new':'t-new','hist':'t-hist','photos':'t-photos','sign':'t-sign','back':'t-back'};Object.values(map).forEach(function(id){var el=document.getElementById(id);if(el)el.style.display='none';});var target=map[t];if(target)document.getElementById(target).style.display='block';['b1','b2','b3','b4','b5'].forEach(function(b,i){var tabs=['new','hist','photos','sign','back'];document.getElementById(b).className=(tabs[i]===t?'on':'');});if(t==='hist')rh();}
function col(){var g=function(id){return document.getElementById(id).value||'';};var chk={};items.forEach(function(it,i){var el=document.getElementById('ch'+i);if(el)chk[it]=el.value;});return{internalId:g('internalId'),jobNo:g('jobNo').replace(' (pending)',''),jobDate:g('jobDate'),clientName:g('clientName'),clientPhone:g('clientPhone'),location:g('location'),genType:g('genType'),serialNo:g('serialNo'),serviceDesc:g('serviceDesc'),extraNotes:g('extraNotes'),chk:chk,photos:photos,sigTech:sigTechData,sigClient:sigClientData};}
function saveJ(){var d=col();if(!d.clientName.trim()){alert('Client Name');return;}var ph=validateKenyanPhone(d.clientPhone);if(!ph.valid){alert('Phone invalid');return;}if(!d.genType.trim()||!d.serialNo.trim()){alert('Generator');return;}if(!d.serviceDesc.trim()){alert('Work');return;}var real=commitJobNo();d.jobNo=real;var jobs=JSON.parse(localStorage.getItem('nj')||'[]');jobs.unshift(d);localStorage.setItem('nj',JSON.stringify(jobs));document.getElementById('jobNo').value=real;document.getElementById('jid').textContent=real;document.getElementById('ss').textContent='Saved with '+photos.length+' photos and signatures';rh();}
function rh(){var jobs=JSON.parse(localStorage.getItem('nj')||'[]');var q=(document.getElementById('sq').value||'').toLowerCase();if(q)jobs=jobs.filter(function(j){return JSON.stringify(j).toLowerCase().includes(q);});document.getElementById('hc').textContent=jobs.length;var jl=document.getElementById('jl');jl.innerHTML=jobs.length?'':'<small>No jobs</small>';jobs.forEach(function(j){var div=document.createElement('div');div.className='jr';var left=document.createElement('div');left.innerHTML='<b>'+j.jobNo+'</b> '+j.clientName+'<br><small>'+(j.photos?j.photos.length:0)+' photos | '+(j.sigTech?'Sig OK':'No sig')+'</small>';var btn=document.createElement('button');btn.className='btn bo';btn.style.width='auto';btn.textContent='Open';btn.onclick=function(){loadJ(j.internalId);};div.appendChild(left);div.appendChild(btn);jl.appendChild(div);});}
function loadJ(id){var jobs=JSON.parse(localStorage.getItem('nj')||'[]');var j=jobs.find(function(x){return x.internalId===id;});if(!j)return;['jobNo','internalId','jobDate','clientName','clientPhone','location','genType','serialNo','serviceDesc','extraNotes'].forEach(function(k){var el=document.getElementById(k);if(el&&j[k])el.value=j[k];});photos=j.photos||[];sigTechData=j.sigTech||'';sigClientData=j.sigClient||'';renderPhotos();if(sigTechData){var img=new Image();img.onload=function(){document.getElementById('sigTech').getContext('2d').drawImage(img,0,0);};img.src=sigTechData;}tab('new');}
function buildMessage(d){var ph=validateKenyanPhone(d.clientPhone);return '*NEUTRON V6 FULL*\n*Job:* '+d.jobNo+'\n*Client:* '+d.clientName+'\n*Phone:* '+(ph.local0||d.clientPhone)+'\n*Gen:* '+d.genType+'\n*Serial:* '+d.serialNo+'\n*Work:* '+d.serviceDesc+'\n*Photos:* '+photos.length+' attached\n*Sign:* '+(sigTechData?'Yes':'No');}
function sendClient(){var d=col();if(d.jobNo.indexOf('pending')!==-1){alert('Save first');return;}var ph=validateKenyanPhone(d.clientPhone);if(!ph.valid){alert('Phone');return;}window.open('https://wa.me/'+ph.full254+'?text='+encodeURIComponent(buildMessage(d)),'_blank');}
function sendOffice(){var d=col();if(d.jobNo.indexOf('pending')!==-1){alert('Save first');return;}window.open('https://wa.me/254795467171?text='+encodeURIComponent(buildMessage(d)),'_blank');}
function clearForm(){if(!confirm('Clear?'))return;['clientName','clientPhone','location','genType','serialNo','serviceDesc','extraNotes'].forEach(function(id){var el=document.getElementById(id);if(el)el.value='';});photos=[];renderPhotos();var nid=genInternalId();var nj=genJobNo();document.getElementById('jobNo').value=nj+' (pending)';document.getElementById('internalId').value=nid;document.getElementById('jobDate').value=getKenyaDate();}
function exp(){var data={jobs:localStorage.getItem('nj'),c:localStorage.getItem('ngc')};var b=new Blob([JSON.stringify(data)],{type:'application/json'});var u=URL.createObjectURL(b);var a=document.createElement('a');a.href=u;a.download='neutron-full.json';a.click();}
function im(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(ev){var d=JSON.parse(ev.target.result);if(d.jobs)localStorage.setItem('nj',d.jobs);if(d.c)localStorage.setItem('ngc',d.c);alert('Imported');location.reload();};r.readAsText(f);}
</script>
</body>
                                                       </html>
