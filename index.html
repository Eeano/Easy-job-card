
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEUTRON ENERGY KENYA - Generator Job Card</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
  body{background:#000;color:#fff;min-height:100vh}
  .header{text-align:center;padding:20px 10px;border-bottom:2px solid #00c853}
  .header img{width:70px;height:70px;border-radius:50%;background:#fff;padding:5px}
  .header h1{font-size:28px;margin-top:10px;line-height:1.1}
  .header h1 span{color:#00e676}
  .header p{color:#00e676;letter-spacing:2px;font-size:13px;margin-top:5px}
  .header .phone{color:#aaa;font-size:13px}
  .card{background:#111;margin:15px;border-radius:12px;overflow:hidden;border:1px solid #222}
  .card-head{background:#0a0a0a;padding:12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #222}
  .card-head img{width:32px;height:32px;border-radius:50%;background:#fff;padding:2px}
  .card-head b{font-size:13px}
  .card-head small{color:#00e676;display:block;font-size:11px}
  .form{padding:15px;background:#f5f5f5;color:#000}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
  .full{grid-column:1 / -1}
  label{font-size:10px;color:#555;font-weight:bold;text-transform:uppercase;margin-bottom:4px;display:block}
  input, textarea{width:100%;padding:12px;background:#1a1a1a;color:#fff;border:1px solid #333;border-radius:8px;font-size:14px}
  textarea{min-height:90px}
  .photo-box{margin-top:15px;background:#e8f5e9;border:1.5px dashed #00c853;border-radius:10px;padding:12px;text-align:center}
  .btn-photo{margin-top:8px;background:#111;color:#00e676;border:1px solid #00c853;padding:12px;border-radius:8px;width:100%;font-weight:bold}
  .actions{display:grid;grid-template-columns:2fr 1fr;gap:10px;margin-top:15px}
  .btn-green{background:#00c853;color:#fff;border:none;padding:14px;border-radius:8px;font-weight:bold}
  .btn-dark{background:#333;color:#fff;border:none;padding:14px;border-radius:8px;font-weight:bold}
  .footer{text-align:center;padding:12px;background:#000;color:#777;font-size:10px}
</style>
</head>
<body>
<div class="header">
  <img src="logo.png">
  <h1>NEUTRON<br><span>ENERGY KENYA</span></h1>
  <p>Your Trusted Energy Partner</p>
  <div class="phone">📞 0795467171</div>
</div>
<div class="card">
  <div class="card-head"><img src="logo.png"><div><b>NEUTRON ENERGY KENYA</b><small>YOUR TRUSTED ENERGY PARTNER</small></div></div>
  <div class="form">
    <div class="row"><div><label>Job No</label><input id="jobNo" readonly></div><div><label>Date</label><input type="date" id="jobDate"></div></div>
    <div class="row"><div><label>Client Name</label><input id="clientName" placeholder="Jina la mteja"></div><div><label>Client Phone</label><input id="clientPhone" placeholder="07..."></div></div>
    <div class="row"><div class="full"><label>Location</label><input id="location"></div></div>
    
    <!-- GENERATOR DETAILS - MPYA -->
    <div class="row"><div><label>Generator Type / Model</label><input id="genType" placeholder="Mf: Perkins 100KVA, Cummins 50KVA"></div><div><label>Serial Number</label><input id="serialNo" placeholder="Mf: SN-123456"></div></div>

    <div class="row"><div class="full"><label>Technician</label><input id="techName" placeholder="Ian (Tech 1)"></div></div>
    <div class="row"><div class="full"><label>Generator Work Done / Kazi Iliyofanyika</label><textarea id="serviceDesc" placeholder="Andika kazi ya generator hapa..."></textarea></div></div>
    
    <div class="photo-box"><b>📸 PIGA PICHA YA KAZI</b><small>Client ataona picha hii</small><input type="file" id="jobPhoto" accept="image/*" style="display:none"><button class="btn-photo" onclick="document.getElementById('jobPhoto').click()">📷 CHUKUA PICHA</button><div id="preview" style="margin-top:10px"></div></div>
    <div class="actions"><button class="btn-green" onclick="sendJob()">✅ TUMA KWA CLIENT + OFISI</button><button class="btn-dark" onclick="logout()">LOGOUT</button></div>
  </div>
  <div class="footer">NEUTRON ENERGY KENYA - Office: 0795467171<br>https://eeano.github.io/Easy-job-card/</div>
</div>
<script>
function getNextJobNo(){let c=localStorage.getItem('neutron_gen_counter');let y=new Date().getFullYear();if(!c){c=1}else{c=parseInt(c)+1}localStorage.setItem('neutron_gen_counter',c);return `GEN-${y}-${String(c).padStart(5,'0')}`;}
function initJobNo(){let s=localStorage.getItem('neutron_current_job');document.getElementById('jobDate').value=new Date().toISOString().split('T')[0];if(!s){s=getNextJobNo();localStorage.setItem('neutron_current_job',s);}document.getElementById('jobNo').value=s;}
document.getElementById('jobPhoto').addEventListener('change',function(e){const f=e.target.files[0];if(f){const r=new FileReader();r.onload=function(ev){document.getElementById('preview').innerHTML=`<img src="${ev.target.result}" style="width:100%;border-radius:8px;max-height:200px;object-fit:cover">`};r.readAsDataURL(f);}});
function newJobAfterSend(){let c=parseInt(localStorage.getItem('neutron_gen_counter')||'1')+1;localStorage.setItem('neutron_gen_counter',c);let next=`GEN-${new Date().getFullYear()}-${String(c).padStart(5,'0')}`;localStorage.setItem('neutron_current_job',next);}
function sendJob(){const jobNo=jobNoEl=document.getElementById('jobNo').value,clientName=document.getElementById('clientName').value,clientPhone=document.getElementById('clientPhone').value,loc=document.getElementById('location').value,tech=document.getElementById('techName').value,genType=document.getElementById('genType').value,serial=document.getElementById('serialNo').value,desc=document.getElementById('serviceDesc').value;if(!clientName||!clientPhone){alert('Jaza Jina na Namba!');return;}const msg=`*NEUTRON ENERGY KENYA*%0A*Job No:* ${jobNo}%0A*Client:* ${clientName}%0A*Location:* ${loc}%0A*Generator Model:* ${genType}%0A*Serial No:* ${serial}%0A*Technician:* ${tech}%0A*Work:*%0A${desc}%0A*Office:* 0795467171`;let clean=clientPhone.replace(/[^0-9]/g,'');if(clean.startsWith('0'))clean='254'+clean.substring(1);window.open(`https://wa.me/${clean}?text=${msg}`,'_blank');setTimeout(()=>{window.open(`https://wa.me/254795467171?text=${msg}`,'_blank');},1000);newJobAfterSend();alert('Job '+jobNo+' Imetumwa!');}
function logout(){localStorage.removeItem('neutron_current_job');initJobNo();document.getElementById('clientName').value='';document.getElementById('clientPhone').value='';document.getElementById('location').value='';document.getElementById('genType').value='';document.getElementById('serialNo').value='';document.getElementById('serviceDesc').value='';document.getElementById('preview').innerHTML='';}
initJobNo();
</script>
</body>
</html>
