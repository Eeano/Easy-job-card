<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NEUTRON V6 FULL - PHOTOS + SIGN</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#000;color:#fff}
.login{position:fixed;inset:0;background:#000;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:#111;border:2px solid #00c853;border-radius:16px;padding:24px;width:100%;max-width:380px;text-align:center}
.login-box input{width:100%;padding:12px;margin:8px 0;background:#1a1a1a;border:1px solid #333;color:#fff;border-radius:8px}
.h{text-align:center;padding:12px;border-bottom:2px solid #00c853;background:#000}
.h span{color:#00e676}
.nav{display:flex;gap:5px;padding:8px;background:#111;overflow:auto}
.nav button{background:#222;color:#aaa;border:1px solid #333;padding:8px 10px;border-radius:20px;font-weight:700;font-size:10px;white-space:nowrap}
.nav button.on{background:#00c853;color:#fff}
.card{background:#111;margin:8px;border-radius:12px;border:1px solid #222;overflow:hidden}
.fh{background:#0a0a0a;padding:10px;font-size:12px}
.form{padding:12px;background:#f5f5f5;color:#000}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.full{grid-column:1/-1}
label{font-size:10px;font-weight:800;color:#555;display:block;margin-bottom:3px}
input,select,textarea{width:100%;padding:10px;background:#1a1a1a;color:#fff;border:1px solid #333;border-radius:6px;font-size:12px}
textarea{min-height:70px}
.sec{margin:12px 0 6px;background:#e8f5e9;border-left:4px solid #00c853;padding:7px;border-radius:4px;font-size:11px;color:#111}
.check{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.chk{background:#1e1e1e;border:1px solid #333;border-radius:6px;padding:6px;display:flex;justify-content:space-between;font-size:11px;color:#fff}
.btn{padding:11px;border-radius:7px;font-weight:800;border:none;width:100%;cursor:pointer;font-size:11px}
.bg{background:#00c853;color:#fff}.bd{background:#333;color:#fff}.bo{background:#111;color:#00e676;border:1px solid #00c853}
.photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.photo-box{background:#1a1a1a;border:1px dashed #555;border-radius:8px;height:100px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.photo-box img{width:100%;height:100%;object-fit:cover}
.sig-wrap{background:#fff;border-radius:8px;padding:6px;margin-top:6px}
.sig-wrap canvas{width:100%;height:120px;background:#fff;touch-action:none}
</style>
</head>
<body>
<div id="loginOverlay" class="login"><div class="login-box"><h2 style="color:#00e676">NEUTRON LOGIN</h2><input id="loginEmail" value="admin@neutron.co.ke"><input id="loginPass" type="password" value="Neutron2025"><button id="loginBtn" class="btn bg" style="margin-top:8px;padding:14px">LOGIN</button><p id="loginMsg" style="font-size:11px;margin-top:8px;min-height:16px;color:#ff5252"></p></div></div>

<div class="h"><h1>NEUTRON<br><span>ENERGY KENYA</span></h1><p style="color:#00e676;font-size:9px">V6 FULL - PHOTOS + SIGNATURE</p><div style="margin-top:6px"><span id="jid" style="font-size:10px;background:#111;padding:4px 8px;border-radius:5px;border:1px solid #333">GEN-...</span> <button id="logoutBtn" style="background:#333;color:#fff;border:none;padding:4px 8px;border-radius:5px;font-size:9px">Logout</button></div></div>

<div class="nav"><button class="on" id="b1">New Job</button><button id="b2">History</button><button id="b3">📷 Photos</button><button id="b4">✍️ Signatures</button><button id="b5">Backup</button></div>

<div id="t-new" class="card"><div class="fh"><b>Job Card</b></div><div class="form">
<div class="row"><div><label>Job No</label><input id="jobNo" readonly><input type="hidden" id="internalId"></div><div><label>Date</label><input type="date" id="jobDate"></div></div>
<div class="sec"><b>Client</b></div>
<div class="row"><div><label>Client Name *</label><input id="clientName"></div><div><label>Phone *</label><input id="clientPhone"><small id="ph"></small></div></div>
<div class="row"><div class="full"><label>Location *</label><input id="location"></div></div>
<div class="sec"><b>Generator</b></div><div class="row"><div><label>Model *</label><input id="genType"></div><div><label>Serial *</label><input id="serialNo"></div></div>
<div class="sec"><b>Work Done</b></div><div class="row"><div class="full"><textarea id="serviceDesc"></textarea></div></div>
<div class="sec"><b>Checklist</b></div><div class="check" id="cl"></div>
<div class="sec"><b>Extra / Costs</b></div><div class="row"><div class="full"><textarea id="extraNotes"></textarea></div></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px"><button id="saveBtn" class="btn bg">SAVE</button><button id="waClientBtn" class="btn bo">Client WA</button></div>
</div></div>

<div id="t-photos" class="card" style="display:none"><div class="fh"><b>📷 Photos - Attached to Job Card</b></div><div class="form"><label>Take Photos or Upload (max 6)</label><input type="file" id="photoInput" accept="image/*" multiple style="background:#fff;color:#000"><div id="photoGrid" class="photo-grid"></div><button id="clearPhotosBtn" class="btn bd" style="margin-top:8px">Clear All Photos</button></div></div>

<div id="t-sign" class="card" style="display:none"><div class="fh"><b>✍️ Signatures</b></div><div class="form">
<label>Technician Signature - Draw with finger</label><div class="sig-wrap"><canvas id="sigTech"></canvas></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px"><button id="clearTechBtn" class="btn bd">Clear</button><button id="saveTechBtn" class="btn bo">Save Tech Sig</button></div>
<label style="margin-top:14px">Client Signature - Draw with finger</label><div class="sig-wrap"><canvas id="sigClient"></canvas></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px"><button id="clearClientBtn" class="btn bd">Clear</button><button id="saveClientBtn" class="btn bo">Save Client Sig</button></div>
<div id="sigStatus" style="font-size:11px;color:#00c853;margin-top:10px"></div>
</div></div>

<div id="t-hist" class="card" style="display:none"><div class="fh"><b>History</b></div><div class="form" style="background:#111"><input id="sq" placeholder="Search..." style="background:#222;color:#fff"><div id="jl" style="margin-top:10px"></div></div></div>
<div id="t-back" class="card" style="display:none"><div class="fh"><b>Backup</b></div><div class="form"><button id="expBtn" class="btn bo">Export</button></div></div>

<script>
var items=["Oil Level","Coolant","Fuel System","Battery","Belts","Air Filter","Oil Filter","Fuel Filter","Exhaust","Mounting","ATS Panel","Alarms","Cooling System","Safety","Wiring","Control Panel"];
var photos=[],sigTechData="",sigClientData="";
function getKenyaDate(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function validatePhone(p){var c=(p||'').replace(/\D/g,'');var n=c;if(c.indexOf('254')===0)n=c.slice(3);else if(c.indexOf('0')===0)n=c.slice(1);return{valid:/^[71]\d{8}$/.test(n),full254:'254'+n,local0:'0'+n};}
function genJobNo(){var c=parseInt(localStorage.getItem('ngc')||'0');return 'GEN-'+new Date().getFullYear()+'-'+String(c+1).padStart(5,'0');}
function commitJobNo(){var c=parseInt(localStorage.getItem('ngc')||'0')+1;localStorage.setItem('ngc',String(c));return 'GEN-'+new Date().getFullYear()+'-'+String(c).padStart(5,'0');}
function genId(){return 'id_'+Date.now();}
function showLogin(s){document.getElementById('loginOverlay').style.display=s?'flex':'none';}
function initApp(){document.getElementById('jobNo').value=genJobNo()+' (pending)';document.getElementById('internalId').value=genId();document.getElementById('jobDate').value=getKenyaDate();document.getElementById('jid').textContent=genJobNo();document.getElementById('cl').innerHTML=items.map(function(it,i){return '<div class="chk"><span>'+it+'</span><select id="ch'+i+'"><option>PASS</option><option>FAIL</option><option>N/A</option></select></div>';}).join('');setupSig('sigTech');setupSig('sigClient');rh();renderPhotos();}
function setupSig(id){var canvas=document.getElementById(id);var ctx=canvas.getContext('2d');function rs(){canvas.width=canvas.offsetWidth*2;canvas.height=240;ctx.scale(2,2);ctx.lineWidth=2;ctx.lineCap='round';ctx.strokeStyle='#000';}rs();var draw=false;function pos(e){var r=canvas.getBoundingClientRect();var t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top};}canvas.addEventListener('mousedown',function(e){draw=true;var p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);});canvas.addEventListener('mousemove',function(e){if(!draw)return;var p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();});canvas.addEventListener('mouseup',function(){draw=false;});canvas.addEventListener('touchstart',function(e){draw=true;var p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);e.preventDefault();});canvas.addEventListener('touchmove',function(e){if(!draw)return;var p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();e.preventDefault();});canvas.addEventListener('touchend',function(){draw=false;});}
document.addEventListener('DOMContentLoaded',function(){
  var logged=localStorage.getItem('neutron_auth')==='logged';showLogin(!logged);if(logged)initApp();
  document.getElementById('loginBtn').addEventListener('click',function(){var e=document.getElementById('loginEmail').value.trim();var p=document.getElementById('loginPass').value.trim();var m=document.getElementById('loginMsg');m.textContent='Checking...';var ok=(e==='admin@neutron.co.ke'&&p==='Neutron2025')||(e==='0795467171'&&p==='0795467171');setTimeout(function(){if(ok){localStorage.setItem('neutron_auth','logged');showLogin(false);initApp();}else{m.textContent='Invalid';}},300);});
  document.getElementById('logoutBtn').addEventListener('click',function(){localStorage.removeItem('neutron_auth');showLogin(true);});
  document.getElementById('b1').addEventListener('click',function(){tab('new');});document.getElementById('b2').addEventListener('click',function(){tab('hist');});document.getElementById('b3').addEventListener('click',function(){tab('photos');});document.getElementById('b4').addEventListener('click',function(){tab('sign');});document.getElementById('b5').addEventListener('click',function(){tab('back');});
  document.getElementById('saveBtn').addEventListener('click',saveJ);document.getElementById('waClientBtn').addEventListener('click',sendWA);
  document.getElementById('photoInput').addEventListener('change',function(e){var files=e.target.files;Array.from(files).forEach(function(f){if(photos.length>=6)return;var r=new FileReader();r.onload=function(ev){photos.push(ev.target.result);renderPhotos();};r.readAsDataURL(f);});});
  document.getElementById('clearPhotosBtn').addEventListener('click',function(){photos=[];renderPhotos();});
  document.getElementById('clearTechBtn').addEventListener('click',function(){var c=document.getElementById('sigTech');c.getContext('2d').clearRect(0,0,c.width,c.height);sigTechData='';});document.getElementById('saveTechBtn').addEventListener('click',function(){sigTechData=document.getElementById('sigTech').toDataURL();document.getElementById('sigStatus').textContent='Tech signature saved ✓';});
  document.getElementById('clearClientBtn').addEventListener('click',function(){var c=document.getElementById('sigClient');c.getContext('2d').clearRect(0,0,c.width,c.height);sigClientData='';});document.getElementById('saveClientBtn').addEventListener('click',function(){sigClientData=document.getElementById('sigClient').toDataURL();document.getElementById('sigStatus').textContent='Client signature saved ✓';});
  document.getElementById('sq').addEventListener('input',rh);document.getElementById('expBtn').addEventListener('click',function(){var data={jobs:localStorage.getItem('nj')};var b=new Blob([JSON.stringify(data)],{type:'application/json'});var u=URL.createObjectURL(b);var a=document.createElement('a');a.href=u;a.download='neutron.json';a.click();});
});
function renderPhotos(){var g=document.getElementById('photoGrid');g.innerHTML='';photos.forEach(function(p,i){var d=document.createElement('div');d.className='photo-box';var img=document.createElement('img');img.src=p;var del=document.createElement('button');del.textContent='X';del.style.cssText='position:absolute;top:2px;right:2px;background:#c00;color:#fff;border:none;border-radius:50%;width:22px;height:22px';del.onclick=function(){photos.splice(i,1);renderPhotos();};d.appendChild(img);d.appendChild(del);g.appendChild(d);});}
function tab(t){var m={'new':'t-new','hist':'t-hist','photos':'t-photos','sign':'t-sign','back':'t-back'};Object.values(m).forEach(function(id){document.getElementById(id).style.display='none';});document.getElementById(m[t]).style.display='block';['b1','b2','b3','b4','b5'].forEach(function(b,i){var tabs=['new','hist','photos','sign','back'];document.getElementById(b).className=(tabs[i]===t?'on':'');});}
function col(){var g=function(id){return document.getElementById(id).value||'';};var chk={};items.forEach(function(it,i){var el=document.getElementById('ch'+i);if(el)chk[it]=el.value;});return{internalId:g('internalId'),jobNo:g('jobNo').replace(' (pending)',''),jobDate:g('jobDate'),clientName:g('clientName'),clientPhone:g('clientPhone'),location:g('location'),genType:g('genType'),serialNo:g('serialNo'),serviceDesc:g('serviceDesc'),extraNotes:g('extraNotes'),chk:chk,photos:photos,sigTech:sigTechData,sigClient:sigClientData};}
function saveJ(){var d=col();if(!d.clientName.trim()){alert('Client Name');return;}var ph=validatePhone(d.clientPhone);if(!ph.valid){alert('Phone invalid');return;}var real=commitJobNo();d.jobNo=real;var jobs=JSON.parse(localStorage.getItem('nj')||'[]');jobs.unshift(d);localStorage.setItem('nj',JSON.stringify(jobs));document.getElementById('jobNo').value=real;document.getElementById('jid').textContent=real;alert('Saved with '+photos.length+' photos + signatures');rh();}
function rh(){var jobs=JSON.parse(localStorage.getItem('nj')||'[]');var jl=document.getElementById('jl');jl.innerHTML=jobs.length?'':'No jobs';jobs.forEach(function(j){var div=document.createElement('div');div.style.cssText='background:#1a1a1a;border:1px solid #333;padding:8px;margin-bottom:6px;border-radius:8px;display:flex;justify-content:space-between';div.innerHTML='<div><b>'+j.jobNo+'</b> '+j.clientName+'<br><small>'+(j.photos?j.photos.length:0)+' 📷 | Sig: '+(j.sigTech?'Yes':'No')+'</small></div>';var b=document.createElement('button');b.textContent='Open';b.className='btn bo';b.style.width='auto';b.onclick=function(){loadJ(j.internalId);};div.appendChild(b);jl.appendChild(div);});}
function loadJ(id){var jobs=JSON.parse(localStorage.getItem('nj')||'[]');var j=jobs.find(function(x){return x.internalId===id;});if(!j)return;['jobNo','internalId','jobDate','clientName','clientPhone','location','genType','serialNo','serviceDesc','extraNotes'].forEach(function(k){var el=document.getElementById(k);if(el&&j[k])el.value=j[k];});photos=j.photos||[];sigTechData=j.sigTech||'';renderPhotos();tab('new');}
function sendWA(){var d=col();if(d.jobNo.indexOf('pending')!==-1){alert('Save first');return;}var ph=validatePhone(d.clientPhone);window.open('https://wa.me/'+ph.full254+'?text='+encodeURIComponent('*NEUTRON*\nJob:'+d.jobNo+'\nClient:'+d.clientName+'\nPhotos:'+photos.length+'\nSig:'+(sigTechData?'Yes':'No')),'_blank');}
</script>
</body>
</html>
