<script>
// ... keep all previous code same ...

// NEW: Same layout & colour PDF for both Office and Client
async function generateSameLayoutPDF(d, type=''){
  const {jsPDF}=window.jspdf; const doc=new jsPDF(); const pageW=doc.internal.pageSize.getWidth();
  // HEADER - BLACK with GREEN like your layout
  doc.setFillColor(0,0,0); doc.rect(0,0,pageW,28,'F');
  doc.setTextColor(255,255,255); doc.setFontSize(16); doc.setFont('helvetica','bold');
  doc.text('NEUTRON ENERGY KENYA',10,12);
  doc.setTextColor(0,230,118); doc.text('JOB CARD',10,20);
  doc.setTextColor(170,170,170); doc.setFontSize(8); doc.text(`JOB CARD + TIME IN/OUT + NEXT SERVICE | ${d.jobNo} | ${type.toUpperCase()} COPY`,10,26);
  
  let y=34;
  // Job Info - green left border style
  function sec(title){ doc.setFillColor(232,245,233); doc.setDrawColor(0,200,83); doc.setLineWidth(0.8); doc.rect(10,y,pageW-20,7,'F'); doc.setFillColor(0,200,83); doc.rect(10,y,2,7,'F'); doc.setTextColor(17,17,17); doc.setFontSize(8); doc.setFont('helvetica','bold'); doc.text(title,14,y+5); y+=10; }
  function field(label,val){ if(y>270){doc.addPage(); y=15;} doc.setFontSize(8); doc.setTextColor(85,85,85); doc.setFont('helvetica','bold'); doc.text(label+':',12,y); doc.setTextColor(0,0,0); doc.setFont('helvetica','normal'); doc.text(String(val||'N/A').substring(0,70),40,y); y+=5; }

  sec(`JOB: ${d.jobNo} | DATE: ${d.jobDate} | TIME: ${d.timeIn} - ${d.timeOut} | STATUS: ${d.jobStatus}`);
  y+=2;
  sec('A. CLIENT DETAILS'); field('Client',d.clientName); field('Phone',d.clientPhone); field('Location',d.location); y+=2;
  sec('B. GENERATOR DETAILS'); field('Model/Type',d.genType); field('Serial No',d.serialNo); y+=2;
  sec('C. RUN HOURS & READINGS'); field('Run Hours',d.runHours+' hrs'); field('Fuel',d.fuelLevel); field('Oil Pressure',d.oilPressure); field('Battery',d.batteryVolt); y+=2;
  sec('D. CAUSE OF PROBLEM'); field('Cause',d.causeProblem); y+=2;
  sec('E. DIAGNOSIS'); field('Diagnosis',d.diagnosis); y+=2;
  sec('F. WORK DONE'); field('Work',d.serviceDesc); y+=2;
  sec('G. PARTS USED'); field('Parts',d.partsUsed||'None'); y+=2;
  sec('H. NEXT SERVICE'); field('Next Date',d.nextServiceDate); field('Next Hours',d.nextServiceHours); field('Notes',d.nextServiceNotes); y+=2;
  sec('I. CHECKLIST & PHOTOS'); field('Photos',photos.length+' photos'); field('Checklist',Object.entries(d.chk||{}).map(([k,v])=>k+':'+v).join(', ').substring(0,80)); y+=4;

  // FOOTER - same black
  doc.setFillColor(0,0,0); doc.rect(0,280,pageW,17,'F');
  doc.setTextColor(0,230,118); doc.setFontSize(7); doc.text(`This is same card layout & colour for both Client and Office | Generated: ${new Date().toLocaleString()} | Photos: ${photos.length}`,10,290);
  
  return doc;
}

async function generatePDF(){
  try{
    const d=col(); if(d.jobNo.indexOf('pending')!==-1){document.getElementById('pdfStatus').textContent='Save job first'; return;}
    const doc=await generateSameLayoutPDF(d,'office');
    doc.save(d.jobNo+'_NEUTRON_SAME_CARD.pdf');
    document.getElementById('pdfStatus').textContent='PDF with SAME layout & colour generated ✓ - '+d.jobNo;
    document.getElementById('pdfStatus').style.color='#00c853';
  }catch(err){document.getElementById('pdfStatus').textContent='ERROR: '+err.message;}
}

function buildMessage(d){return `*NEUTRON ENERGY KENYA - SAME CARD*\n*Job:* ${d.jobNo} - *${d.jobStatus}*\n*Date:* ${d.jobDate} | *Time:* ${d.timeIn} to ${d.timeOut}\n*Client:* ${d.clientName} | ${d.genType}\n*Next Service:* ${d.nextServiceDate} @ ${d.nextServiceHours}hrs\n*Work Done:* ${d.serviceDesc}\n\n📄 *PDF with same layout & colour is downloaded - attach it here. Both Office and Client receive IDENTICAL card.*`;}

async function sendClient(){
  const d=col(); if(d.jobNo.indexOf('pending')!==-1){alert('Save first'); return;}
  const doc=await generateSameLayoutPDF(d,'client');
  doc.save(d.jobNo+'_CLIENT_SAME_CARD.pdf');
  const ph=validatePhone(d.clientPhone);
  setTimeout(()=>{window.open('https://wa.me/'+ph.full254+'?text='+encodeURIComponent(buildMessage(d)),'_blank');},500);
}

async function sendOffice(){
  const d=col(); if(d.jobNo.indexOf('pending')!==-1){alert('Save first'); return;}
  const doc=await generateSameLayoutPDF(d,'office');
  doc.save(d.jobNo+'_OFFICE_SAME_CARD.pdf');
  setTimeout(()=>{window.open('https://wa.me/254795467171?text='+encodeURIComponent(buildMessage(d)),'_blank');},500);
}
</script>
