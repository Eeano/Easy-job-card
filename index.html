<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NEUTRON ENERGY KENYA - SECURE V7</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#000;color:#fff}
.login{position:fixed;inset:0;background:#000;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}.login-box{background:#111;border:2px solid #00c853;border-radius:16px;padding:24px;width:100%;max-width:380px;text-align:center}.login-box input{width:100%;padding:12px;margin:8px 0;background:#1a1a1a;border:1px solid #333;color:#fff;border-radius:8px}
.h{text-align:center;padding:12px;border-bottom:2px solid #00c853;background:#000;position:sticky;top:0;z-index:10}.nav{display:flex;gap:4px;padding:8px;background:#111;position:sticky;top:78px;z-index:9}.nav button{background:#222;color:#aaa;border:1px solid #333;padding:8px 12px;border-radius:20px;font-weight:700;font-size:10px}.nav button.on{background:#00c853;color:#fff}
.card{background:#111;margin:8px;border-radius:12px;border:1px solid #222;overflow:hidden}.fh{background:#0a0a0a;padding:10px;font-size:12px}.form{padding:12px;background:#f5f5f5;color:#000}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.full{grid-column:1/-1}label{font-size:10px;font-weight:800;color:#555;display:block;margin-bottom:3px}input,select,textarea{width:100%;padding:10px;background:#1a1a1a;color:#fff;border:1px solid #333;border-radius:6px;font-size:12px}textarea{min-height:70px}.sec{margin:14px 0 6px;background:#e8f5e9;border-left:4px solid #00c853;padding:7px;border-radius:4px;font-size:11px;color:#111;font-weight:800}.check{display:grid;grid-template-columns:1fr 1fr;gap:6px}.chk{background:#1e1e1e;border:1px solid #333;border-radius:6px;padding:6px;display:flex;justify-content:space-between;font-size:11px;color:#fff}.btn{padding:11px;border-radius:7px;font-weight:800;border:none;width:100%;cursor:pointer;font-size:11px}.bg{background:#00c853;color:#fff}.bd{background:#333;color:#fff}.bo{background:#111;color:#00e676;border:1px solid #00c853}.photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.photo-box{background:#1a1a1a;border:1px dashed #555;border-radius:8px;height:110px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.photo-box img{width:100%;height:100%;object-fit:cover}.sig-section{background:#fff;border-radius:10px;padding:10px;margin-top:10px;border:2px solid #00c853}.sig-canvas{width:100%;height:160px;background:#fff;border:2px solid #333;border-radius:8px;display:block;touch-action:none}.jr{background:#1a1a1a;border:1px solid #333;border-radius:8px;padding:8px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#fff}
</style>
</head>
<body>
<div id="loginOverlay" class="login"><div class="login-box"><h2 style="color:#00e676">NEUTRON SECURE LOGIN</h2><p style="color:#888;font-size:10px">Supabase Auth - Real Login</p><input id="loginEmail" placeholder="Email" value="admin@neutron.co.ke"><input id="loginPass" type="password" placeholder="Password" value="Neutron2025"><button id="loginBtn" class="btn bg" style="margin-top:8px;padding:14px">SECURE LOGIN</button><p id="loginMsg" style="font-size:11px;margin-top:8px;color:#ff5252"></p></div></div>
<div class="h"><h1>NEUTRON<br><span style="color:#00e676">ENERGY KENYA</span></h1><p style="color:#aaa;font-size:9px">SECURE V7 - SUPABASE + RLS</p><div style="margin-top:4px"><span id="jid" style="font-size:10px;background:#111;padding:4px 8px;border-radius:5px;border:1px solid #333">GEN-...</span> <span id="userInfo" style="font-size:9px;color:#00e676;margin-left:6px"></span> <button id="logoutBtn" style="background:#333;color:#fff;border:none;padding:4px 8px;border-radius:5px;font-size:9px">Logout</button></div></div>
<div class="nav"><button class="on" id="b1">NEW JOB</button><button id="b2">HISTORY</button><button id="b3">BACKUP</button></div>
<div id="t-new" class="card"><div class="fh"><b>Job Card - Central DB</b></div><div class="form">
<div class="row"><div><label>Job No</label><input id="jobNo" readonly><input type="hidden" id="internalId"></div><div><label>Date</label><input type="date" id="jobDate"></div></div>
<div class="sec">A. CLIENT</div><div class="row"><div><label>Client Name *</label><input id="clientName"></div><div><label>Phone *</label><input id="clientPhone"></div></div><div class="row"><div class="full"><label>Location *</label><input id="location"></div></div>
<div class="sec">B. GENERATOR</div><div class="row"><div><label>Model</label><input id="genType"></div><div><label>Serial</label><input id="serialNo"></div></div>
<div class="sec">C. RUN HOURS</div><div class="row"><div><label>Run Hours *</label><input id="runHours" type="number"></div><div><label>Fuel</label><select id="fuelLevel"><option>100%</option><option>75%</option><option>50%</option><option>25%</option></select></div></div><div class="row"><div><label>Oil Pressure</label><input id="oilPressure"></div><div><label>Battery Volt</label><input id="batteryVolt"></div></div>
<div class="sec">D. WORK DONE</div><div class="row"><div class="full"><textarea id="serviceDesc"></textarea></div></div>
<div class="sec">E. CHECKLIST</div><div class="check" id="cl"></div>
<div class="sec">F. PHOTOS</div><input type="file" id="photoInput" accept="image/*" multiple style="background:#fff;color:#000;padding:10px;border-radius:6px"><div id="photoGrid" class="photo-grid"></div>
<div class="sec">G. SIGNATURES - BOTTOM - DRAWABLE</div>
<div class="sig-section"><label>TECH SIGNATURE</label><canvas id="sigTech" class="sig-canvas" width="300" height="160"></canvas><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px"><button type="button" id="clearTechBtn" class="btn bd">Clear</button><button type="button" id="saveTechBtn" class="btn bo">Save Tech Sig</button></div><div id="techSigStatus" style="font-size:10px;color:#666;margin-top:6px"></div></div>
<div class="sig-section" style="margin-top:12px"><label>CLIENT SIGNATURE</label><canvas id="sigClient" class="sig-canvas" width="300" height="160"></canvas><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px"><button type="button" id="clearClientBtn" class="btn bd">Clear</button><button type="button" id="saveClientBtn" class="btn bo">Save Client Sig</button></div><div id="clientSigStatus" style="font-size:10px;color:#666;margin-top:6px"></div></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:16px"><button id="saveBtn" class="btn bg" style="padding:14px">SAVE TO CLOUD DB</button><button id="waClientBtn" class="btn bo">Client WhatsApp</button></div><div id="ss" style="font-size:11px;color:#00c853;margin-top:10px;font-weight:800"></div>
</div></div>
<div id="t-hist" class="card" style="display:none"><div class="fh"><b>History - From Supabase</b></div><div class="form" style="background:#111"><input id="sq" placeholder="Search..." style="background:#222;color:#fff"><div id="jl" style="margin-top:10px"></div></div></div>
<div id="t-back" class="card" style="display:none"><div class="fh"><b>Backup - Cloud to Local</b></div><div class="form"><button id="expBtn" class="btn bo">Export Cloud Jobs</button><div id="at" style="background:#1a1a1a;color:#aaa;padding:8px;border-radius:6px;max-height:120px;overflow:auto;font-size:10px;margin-top:8px"></div></div></div>
<script>
const SUPABASE_URL = 'YOUR_SUPABASE_URL';
const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

var items=["Oil Level","Coolant","Fuel System","Battery","Belts","Air Filter","Oil Filter","Fuel Filter","Exhaust","Mounting","ATS Panel","Alarms","Cooling System","Safety","Wiring","Control Panel"];
var photos=[],sigTechData="",sigClientData="";

function showLogin(s){document.getElementById('loginOverlay').style.display=s?'flex':'none';}
function getKenyaDate(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function genJobNo(){return 'GEN-'+new Date().getFullYear()+'-'+Date.now().toString().slice(-5);}

function initApp(){
  document.getElementById('jobNo').value=genJobNo()+' (pending)';
  document.getElementById('jobDate').value=getKenyaDate();
  document.getElementById('jid').textContent=genJobNo();
  document.getElementById('cl').innerHTML=items.map((it,i)=>`<div class="chk"><span>${it}</span><select id="ch${i}"><option>PASS</option><option>FAIL</option><option>N/A</option></select></div>`).join('');
  setTimeout(()=>{setupCanvas('sigTech');setupCanvas('sigClient');},300);
  rh();
}

function setupCanvas(id){
  var c=document.getElementById(id); var ctx=c.getContext('2d');
  var rect=c.getBoundingClientRect(); c.width=rect.width; c.height=160;
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height);
  ctx.strokeStyle='#000'; ctx.lineWidth=3; ctx.lineCap='round';
  var drawing=false;
  function getXY(e){var r=c.getBoundingClientRect(); var t=e.touches?e.touches[0]:e; return {x:t.clientX-r.left, y:t.clientY-r.top};}
  c.addEventListener('touchstart', e=>{drawing=true; var p=getXY(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); e.preventDefault();},{passive:false});
  c.addEventListener('touchmove', e=>{if(!drawing)return; var p=getXY(e); ctx.lineTo(p.x,p.y); ctx.stroke(); e.preventDefault();},{passive:false});
  c.addEventListener('touchend', e=>{drawing=false; e.preventDefault();},{passive:false});
  c.addEventListener('mousedown', e=>{drawing=true; var p=getXY(e); ctx.beginPath(); ctx.moveTo(p.x,p.y);});
  c.addEventListener('mousemove', e=>{if(!drawing)return; var p=getXY(e); ctx.lineTo(p.x,p.y); ctx.stroke();});
  c.addEventListener('mouseup', ()=>{drawing=false;});
}

document.addEventListener('DOMContentLoaded', async ()=>{
  const {data:{session}} = await supabase.auth.getSession();
  if(session){showLogin(false); document.getElementById('userInfo').textContent=session.user.email; initApp();}
  else showLogin(true);

  document.getElementById('loginBtn').addEventListener('click', async ()=>{
    var email=document.getElementById('loginEmail').value.trim();
    var pass=document.getElementById('loginPass').value.trim();
    var msg=document.getElementById('loginMsg');
    msg.textContent='Checking Supabase...';
    const {data, error} = await supabase.auth.signInWithPassword({email, password: pass});
    if(error){msg.textContent=error.message; msg.style.color='#ff5252';}
    else{msg.textContent='SUCCESS - Verified session'; msg.style.color='#00e676'; showLogin(false); document.getElementById('userInfo').textContent=data.user.email; initApp();}
  });

  document.getElementById('logoutBtn').addEventListener('click', async ()=>{await supabase.auth.signOut(); showLogin(true);});
  document.getElementById('b1').addEventListener('click',()=>tab('new')); document.getElementById('b2').addEventListener('click',()=>tab('hist')); document.getElementById('b3').addEventListener('click',()=>tab('back'));
  document.getElementById('saveBtn').addEventListener('click', saveToCloud);
  document.getElementById('photoInput').addEventListener('change', e=>{Array.from(e.target.files).forEach(f=>{if(photos.length>=6)return; var r=new FileReader(); r.onload=ev=>{photos.push(ev.target.result); renderPhotos();}; r.readAsDataURL(f);});});
  document.getElementById('clearTechBtn').addEventListener('click', ()=>{var c=document.getElementById('sigTech'); var ctx=c.getContext('2d'); ctx.clearRect(0,0,c.width,c.height); ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height); sigTechData='';});
  document.getElementById('saveTechBtn').addEventListener('click', ()=>{sigTechData=document.getElementById('sigTech').toDataURL(); document.getElementById('techSigStatus').textContent='Tech sig saved ✓';});
  document.getElementById('clearClientBtn').addEventListener('click', ()=>{var c=document.getElementById('sigClient'); var ctx=c.getContext('2d'); ctx.clearRect(0,0,c.width,c.height); ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height); sigClientData='';});
  document.getElementById('saveClientBtn').addEventListener('click', ()=>{sigClientData=document.getElementById('sigClient').toDataURL(); document.getElementById('clientSigStatus').textContent='Client sig saved ✓';});
});

function renderPhotos(){var g=document.getElementById('photoGrid'); g.innerHTML=''; photos.forEach((p,i)=>{var d=document.createElement('div'); d.className='photo-box'; var img=document.createElement('img'); img.src=p; var del=document.createElement('button'); del.textContent='X'; del.style.cssText='position:absolute;top:3px;right:3px;background:#c00;color:#fff;border:none;border-radius:50%;width:22px;height:22px'; del.onclick=()=>{photos.splice(i,1); renderPhotos();}; d.appendChild(img); d.appendChild(del); g.appendChild(d);});}

async function saveToCloud(){
  var jobNo=genJobNo();
  var checklist={}; items.forEach((it,i)=>{var el=document.getElementById('ch'+i); if(el) checklist[it]=el.value;});
  var clientName=document.getElementById('clientName').value;
  var clientPhone=document.getElementById('clientPhone').value;
  if(!clientName || !clientPhone){alert('Client Name + Phone required'); return;}
  
  var ss=document.getElementById('ss'); ss.textContent='Saving to Supabase central DB...'; ss.style.color='#ff0';
  
  const {data:{user}} = await supabase.auth.getUser();
  const {data, error} = await supabase.from('jobs').insert([{
    job_no: jobNo,
    job_date: document.getElementById('jobDate').value,
    client_name: clientName,
    client_phone: clientPhone,
    location: document.getElementById('location').value,
    gen_type: document.getElementById('genType').value,
    serial_no: document.getElementById('serialNo').value,
    run_hours: parseFloat(document.getElementById('runHours').value)||0,
    fuel_level: document.getElementById('fuelLevel').value,
    oil_pressure: document.getElementById('oilPressure').value,
    battery_volt: document.getElementById('batteryVolt').value,
    service_desc: document.getElementById('serviceDesc').value,
    checklist: checklist,
    photos: photos,
    sig_tech: sigTechData,
    sig_client: sigClientData,
    user_id: user.id
  }]).select();

  if(error){ ss.textContent='ERROR: '+error.message; ss.style.color='#ff5252'; console.error(error);}
  else{ ss.textContent='SUCCESS: Saved to cloud DB - '+jobNo; ss.style.color='#00c853'; document.getElementById('jid').textContent=jobNo; document.getElementById('jobNo').value=jobNo; rh();}
}

async function rh(){
  const {data, error} = await supabase.from('jobs').select('*').order('created_at',{ascending:false}).limit(50);
  if(error){console.error(error); return;}
  var jl=document.getElementById('jl'); jl.innerHTML='';
  data.forEach(j=>{
    var div=document.createElement('div'); div.className='jr';
    div.innerHTML=`<div><b>${j.job_no}</b> ${j.client_name}<br><small>Run:${j.run_hours}hrs | ${j.photos?j.photos.length:0} photos</small></div>`;
    jl.appendChild(div);
  });
  document.getElementById('hc').textContent=data.length;
  document.getElementById('at').textContent=JSON.stringify(data,null,2).slice(0,2000);
}

function tab(t){var map={'new':'t-new','hist':'t-hist','back':'t-back'}; Object.values(map).forEach(id=>document.getElementById(id).style.display='none'); document.getElementById(map[t]).style.display='block'; ['b1','b2','b3'].forEach((b,i)=>{var tabs=['new','hist','back']; document.getElementById(b).className=(tabs[i]===t?'on':'');}); if(t==='hist') rh();}
</script>
</body>
</html>
